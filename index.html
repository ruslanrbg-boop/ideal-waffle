<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ИНТЕГРАЦИЯ — Основа Сильных Проектов</title><style>:root{--b:#0675df;--n:#0b285c;--l:#e4f2ff;--m:#657a95}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--n);font:15px/1.55 Arial,sans-serif}a{text-decoration:none;color:inherit}.wrap{max-width:1160px;margin:auto;padding:0 25px}header{position:sticky;top:0;z-index:4;background:#fffffff5;border-bottom:1px solid #dbe8f5}.nav{display:flex;align-items:center;flex-wrap:wrap;gap:18px;min-height:72px}.brand{font-weight:900;font-size:19px;letter-spacing:1px;white-space:nowrap}.mark{display:inline-block;background:linear-gradient(140deg,#0350c6,#00a0ff);height:29px;width:28px;clip-path:polygon(50% 0,100% 100%,75% 100%,50% 45%,25% 100%,0 100%);vertical-align:middle;margin-right:10px}.links{display:flex;flex-wrap:wrap;gap:12px;margin-left:auto}.links a{font-size:12px;font-weight:bold}.links a:hover,.more{color:var(--b)}.btn{display:inline-block;border-radius:6px;padding:11px 17px;background:linear-gradient(110deg,#0345bb,#068de9);color:white;font-weight:bold;font-size:13px;border:0;cursor:pointer}.btn.ghost{background:white;color:var(--b);border:1px solid var(--b)}.hero{background:linear-gradient(110deg,#f7fbff,#e7f4ff 55%,#9bccf0);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:55%;height:140%;right:-12%;top:-10%;background:repeating-linear-gradient(90deg,#15528d 0 8px,#b5dff6 9px 34px);transform:skewX(-22deg);opacity:.35}.hero .wrap{padding-top:86px;padding-bottom:96px;position:relative;z-index:1}.hero .copy{max-width:600px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:bold;color:#3767a2}h1{font-size:clamp(34px,5vw,64px);line-height:1.1;margin:16px 0}h2{font-size:clamp(23px,3vw,34px);line-height:1.2;margin:0 0 18px}h3{font-size:17px;margin:8px 0}p{color:var(--m)}.hero h2{color:var(--b)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:25px}.section{padding:58px 0;border-bottom:1px solid #e7eef7}.section.soft{background:#f4f9ff}.heading{text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid #d5e2f0;padding-bottom:16px}.grid{display:grid;gap:14px}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{border-radius:8px;border:1px solid #d9e7f6;background:linear-gradient(140deg,#fff,#f0f8ff);padding:18px;min-width:0}.card.tap:hover{border-color:var(--b);box-shadow:0 8px 18px #005acf1b;transform:translateY(-2px)}.card.tap{transition:.2s}.ico{display:block;font-size:28px;color:var(--b);margin-bottom:12px}.card strong{display:block;line-height:1.35}.small{font-size:12px;color:var(--m)}.overview{display:grid;grid-template-columns:1fr 1.2fr;gap:40px}.fact{border-left:3px solid var(--b);padding:5px 12px;font-size:14px;font-weight:bold}.photo{height:120px;border-radius:6px;background:linear-gradient(125deg,#a7dafa,#114c88 80%);position:relative;overflow:hidden}.photo:after{content:"";position:absolute;inset:25% 12% -20% 30%;background:repeating-linear-gradient(90deg,#19528e 0 7px,#c9eafb 8px 24px);transform:skewY(-8deg)}.service ul{padding-left:21px;font-size:12px;color:var(--m)}.service li{margin:5px 0}.step b{font-size:24px;color:#7eaee6;display:block}.contact{display:grid;grid-template-columns:1fr 1.2fr;gap:35px}form{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea{font:inherit;border:1px solid #bed3ea;padding:12px;width:100%;border-radius:5px}textarea,form button,form small{grid-column:1/-1}textarea{min-height:75px}footer{background:#0b2858;color:#fff;padding:25px 0}.draft{border:1px solid #edddad;border-radius:7px;background:#fff7e5;padding:20px;color:#886d34}@media(max-width:950px){.g5,.g4{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.links{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:8px}.g5,.g4,.g3,.g2,.overview,.contact{grid-template-columns:1fr 1fr}.hero .wrap{padding:60px 20px}.section{padding:35px 0}.contact,.overview{grid-template-columns:1fr}.wrap{padding:0 17px}}@media(max-width:430px){.g5,.g4,.g3,.g2{grid-template-columns:1fr}}</style></head><body><header><div class="wrap nav"><a href="#/" class="brand"><i class="mark"></i>ИНТЕГРАЦИЯ</a><nav class="links"><a href="#/">Главная</a><a href="#/about">О компании</a><a href="#/directions">Наши направления</a><a href="#/projects">Проекты</a><a href="#/gallery">Галерея</a><a href="#/contact">Контакты</a></nav><a class="btn ghost" href="#/login">Вход / Регистрация</a></div></header><main id="app"></main><footer><div class="wrap"><strong>ИНТЕГРАЦИЯ</strong> · Основа Сильных Проектов <span style="float:right">Ваши задачи. Наши ресурсы. Общий результат.</span></div></footer><script>const dirs=["Генеральные подрядчики","Управляющие компании","ТСЖ и ЖСК","Собственники коммерческой недвижимости","Промышленные предприятия","Логистические и складские комплексы","Гостиницы, отели и апарт-комплексы","Государственные и муниципальные учреждения","Государственные и муниципальные заказчики","Торговые сети и сетевые компании","Эксплуатирующие организации","Коттеджные посёлки","Инвесторы и владельцы объектов недвижимости"],svc=[["Общестроительные работы","Монолитные и бетонные работы|Кладочные работы|Устройство перегородок|Сварочные работы"],["Отделочные работы","Штукатурные работы|Малярные работы|Плиточные работы|Устройство стяжки и промышленных полов|Устройство потолков и ГКЛ"],["Фасадные работы","Утепление фасадов|Штукатурка фасада|Облицовка фасадов|Сайдинг"],["Кровельные работы","Монтаж мягкой кровли|Монтаж Направляемой кровли|Фальцевая кровля|Монтаж водосточной системы"],["Сантехнические работы",""],["Электрика",""],["ОВиК",""],["Предоставление Разнорабочих на объект",""]];const e=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;');const sec=(title,content,cl='',id='')=>'<section class="section '+cl+'" id="'+id+'"><div class="wrap"><h2 class="heading">'+title+'</h2>'+content+'</div></section>';const hero=(k,t,d)=>'<div class="hero"><div class="wrap"><div class="copy"><div class="eyebrow">'+k+'</div><h1>ИНТЕГРАЦИЯ</h1><h2>'+t+'</h2><p>'+d+'</p><div class="actions"><a class="btn" href="#/directions">Наши направления →</a><a class="btn ghost" href="#/contact">Обсудить проект</a></div></div></div></div>';const direction=()=>sec('Наши направления','<div class="grid g5">'+dirs.map((x,i)=>'<a href="#/dir/'+i+'" class="card tap"><span class="ico">'+['▤','▥','⌂','▧','▦','▣','▤','♜','▥','▧','⚙','⌂','◇'][i]+'</span><strong>'+e(x)+'</strong><span class="small more">Подробнее →</span></a>').join('')+'</div>','','directions');const about=()=>sec('О компании','<div class="overview"><div><h2>ИНТЕГРАЦИЯ — возможности, на которые можно опереться</h2><p>10 лет опыта, специалисты, собственная техника и управление строительными процессами.</p></div><div class="grid g2">'+['10 лет на рынке','Собственные ресурсы','Быстрый выход на объект','ИТР к каждому объекту','Строгий контроль на каждом этапе','Работаем круглый год','Быстрая мобилизация бригад под объёмы'].map(x=>'<div class="fact">'+x+'</div>').join('')+'</div></div>','soft','about');const resources=()=>sec('Наши ресурсы','<div class="grid g5">'+['Команда специалистов','Собственная техника','Материалы и поставки','Организация и управление','Большая партнёрская карта'].map(x=>'<div class="card"><span class="ico">◇</span><strong>'+x+'</strong></div>').join('')+'</div>');const projects=()=>sec('Наши проекты','<p class="small">Демонстрационные изображения, не реальные объекты компании. Заменим после согласования.</p><div class="grid g3">'+['Коммерческая недвижимость','Производственные объекты','Общественные здания'].map(x=>'<div class="card"><div class="photo"></div><h3>'+x+'</h3><p class="small">Фото-заглушка</p></div>').join('')+'</div>','','projects');const steps=()=>sec('Как мы работаем','<div class="grid g5">'+['Обращение','Оценка задачи','Подготовка','Выполнение работ','Сдача результата'].map((x,i)=>'<div class="card step"><b>0'+(i+1)+'</b>'+x+'</div>').join('')+'</div>','soft');const contact=()=>sec('Обсудим ваш проект?','<div class="contact"><div><p>Расскажите о своей задаче. Обсудим формат сотрудничества.</p><p class="small">Контактные данные добавим после согласования.</p></div><form id="lead"><input required placeholder="Ваше имя"><input required type="tel" placeholder="Телефон"><textarea placeholder="Опишите задачу"></textarea><button type="submit" class="btn">Отправить заявку</button><small class="small">Демо-форма: отправка пока не подключена.</small></form></div>','soft','contact');const why=()=>sec('Почему ИНТЕГРАЦИЯ','<div class="grid g3">'+['10 лет на рынке','Собственная техника','Квалифицированные специалисты','Оперативная мобилизация','Контроль качества','Работа круглый год'].map(x=>'<div class="card"><span class="ico">◇</span><strong>'+x+'</strong></div>').join('')+'</div>');const general=()=>hero('Для генеральных подрядчиков','Надёжный партнёр для генеральных подрядчиков','Строительные работы, специалисты и собственные ресурсы для решения задач на объекте.')+sec('Что мы предлагаем','<div class="grid g4">'+svc.map((x,i)=>'<div class="card service"><div class="photo"></div><h3>'+e(x[0])+'</h3>'+(x[1]?'<ul>'+x[1].split('|').map(w=>'<li>'+e(w)+'</li>').join('')+'</ul>':'<p class="small">Подробный перечень согласуем позднее.</p>')+'</div>').join('')+'</div>')+why()+projects()+contact();const uk=()=>hero('Для управляющих компаний','Надёжный партнёр для управляющих компаний','Вы заботитесь об интересах жителей. Мы помогаем решать строительные задачи вашего дома.')+sec('Что мы предлагаем','<div class="grid g3">'+['Ремонт подъездов и мест общего пользования','Ремонт фасадов и входных групп','Ремонт кровель','Ремонт подвалов и технических помещений','Восстановительные работы','Благоустройство территорий'].map(x=>'<div class="card"><span class="ico">⌂</span><strong>'+x+'</strong></div>').join('')+'</div>')+why()+projects()+contact();const home=()=>hero('Строительные решения для сильных проектов','Ваши задачи.<br>Наши ресурсы.<br><span style="color:#123c81">Общий результат.</span>','Многопрофильная строительная компания с 10-летним опытом. Собственные ресурсы и работа круглый год.')+direction()+about()+resources()+projects()+steps()+contact();function render(){let p=location.hash.slice(2).split('/'),n=p[0];let a=document.getElementById('app');if(n==='dir'){let i=Number(p[1]);a.innerHTML=i===0?general():i===1?uk():'<div class="wrap" style="padding-top:65px;padding-bottom:95px"><a class="more" href="#/directions">← Все направления</a><h1>'+e(dirs[i]||'Наши направления')+'</h1><div class="draft">Страница пока не согласована. Заполним её вместе при общей проверке.</div></div>';}else if(['about','directions','projects','contact'].includes(n)){a.innerHTML=home();requestAnimationFrame(()=>document.getElementById(n)?.scrollIntoView())}else if(n==='gallery'){a.innerHTML=projects()}else if(n==='login'){a.innerHTML='<div class="wrap" style="padding:70px 25px"><h1>Вход / Регистрация</h1><div class="draft">Авторизация пока не подключена.</div></div>'}else a.innerHTML=home();if(!['about','directions','projects','contact'].includes(n))scrollTo(0,0)}window.addEventListener('hashchange',render);document.addEventListener('submit',x=>{if(x.target.id==='lead'){x.preventDefault();alert('Это демонстрационная версия. Отправка заявок пока не подключена.')}});render();</script></body></html>
